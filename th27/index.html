<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Таиланд 2027</title>
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
<link rel="stylesheet" href="../css/style.css">
<style>
  body { padding-bottom: 24px; }
  .group-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .section-title { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin: 26px 0 10px; }
  .builder-title { font-weight: 600; font-size: 16px; margin-bottom: 14px; }

  .cart-head { display: flex; align-items: center; gap: 10px; }
  .group-header {
    flex: 1; min-width: 0;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0; margin: 0; border: 0; background: none; cursor: pointer;
    font: inherit; color: inherit; text-align: left;
  }
  .group-header:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
  .group-title { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; min-width: 0; }
  .group-title .t { min-width: 0; }
  .chev { flex: none; display: inline-block; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(45deg); transition: transform .15s; margin-top: -3px; }
  .group-card.collapsed .chev { transform: rotate(-45deg); margin-top: 0; }
  .group-size { color: var(--muted); font-size: 13px; font-weight: 400; white-space: nowrap; }
  .group-route { color: var(--muted); font-size: 12px; font-weight: 400; margin-top: 1px; }
  .group-right { display: flex; align-items: baseline; gap: 14px; flex: none; }
  .group-sum { font-weight: 700; font-size: 15px; color: var(--accent); white-space: nowrap; }
  .group-sum small { font-weight: 400; color: var(--muted); font-size: 11px; }
  .group-body { margin-top: 14px; }
  .group-card.collapsed .group-body { display: none; }
  .group-card.collapsed { padding-bottom: 14px; padding-top: 14px; }

  .trash {
    flex: none; width: 34px; height: 34px; padding: 0; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .trash:hover { color: #dc2626; border-color: #fca5a5; background: #fef2f2; }
  .trash:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .trash svg { width: 18px; height: 18px; }

  .cart-empty { color: var(--muted); font-size: 14px; padding: 18px; text-align: center;
    border: 1px dashed var(--border); border-radius: 12px; }

  .points {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
    padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--border);
  }
  .field label { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
  select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; background: var(--card); color: var(--text); cursor: pointer;
  }
  select:hover { border-color: #c3ccdb; }
  select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  select:disabled { background: var(--bg); color: var(--muted); cursor: not-allowed; }

  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .col { min-width: 0; }
  .col-title { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .col .field { margin-bottom: 10px; }

  .plaque {
    padding: 10px 12px; background: var(--bg); border-radius: 6px;
    border-left: 3px solid var(--accent); margin-bottom: 10px; font-size: 13px;
  }
  .plaque.leg { border-left-color: #94a3b8; }
  .plaque.warn { border-left-color: #d97706; background: #fff9ef; }
  .plaque.empty { border-left-color: #ef4444; color: #b91c1c; }
  .plaque .when { font-weight: 600; }
  .plaque .route { margin-top: 2px; }
  .plaque .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .plaque .ok { color: #059669; }
  .plaque .bad { color: #b45309; }
  .plaque .note { font-size: 12px; margin-top: 4px; color: #475569; }
  .plaque .price-line { margin-top: 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .plaque .price { font-weight: 700; color: var(--accent); font-size: 15px; }
  .plaque .price small { font-weight: 400; color: var(--muted); font-size: 11px; }
  .plaque a { font-size: 12px; color: var(--accent); margin-left: 8px; }
  .chip.ok { color: #047857; background: #e6f7ef; }
  .fl { margin-top: 4px; font-size: 12px; line-height: 1.3; color: #334155; }
  .fl-leg sup { color: var(--muted); font-size: 10px; margin-left: 1px; }
  .fl-dim { color: var(--muted); }
  .plaque .fl a, .plaque .meta a { margin-left: 0; font-size: inherit; }
  .fl-lay { padding-left: 10px; color: var(--muted); }
  .fl-lay.warn { color: #b45309; }
  .fl-lay.danger { color: #b91c1c; font-weight: 600; }
  .chip {
    display: inline-block; font-size: 11px; font-weight: 500; color: #b45309;
    background: #fff4e5; border-radius: 6px; padding: 1px 7px; margin-top: 4px;
  }

  .breakdown {
    margin-top: 4px; padding: 12px 14px; background: var(--accent-soft); border-radius: 8px; font-size: 13px;
  }
  .breakdown .row { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
  .breakdown .row span:first-child { color: var(--muted); }
  .breakdown .row:first-child span:last-child { font-weight: 600; }
  .breakdown .row.total { font-size: 18px; font-weight: 700; color: var(--accent); }
  .breakdown .row.total span:first-child { color: var(--accent); }
  .breakdown .row.total span:last-child { font-weight: 700; }
  .breakdown .issues { margin-top: 8px; color: #b45309; font-size: 12px; }

  .add-row { display: flex; justify-content: flex-end; margin-top: 12px; }
  .btn {
    padding: 10px 22px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { background: #cbd5e1; cursor: not-allowed; filter: none; }
  .btn { white-space: nowrap; }
  .btn.need-pair:disabled { background: #fef2f2; color: #b91c1c; border: 1px solid #fca5a5; }

  .summary-box {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--card); border-top: 1px solid var(--border);
    box-shadow: 0 -4px 16px rgba(0,0,0,.06);
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
  }
  .summary-inner { max-width: 1080px; margin: 0 auto; }
  .summary-total { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-top: 8px; border-top: 2px solid var(--border); }
  .summary-groups { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 8px; }
  .summary-group { font-size: 12px; min-width: 0; }
  .summary-group .n { color: var(--muted); }
  .summary-group .p { font-weight: 600; font-size: 14px; }
  .summary-group.none .p { color: var(--muted); font-weight: 400; }
  .all-added { color: var(--muted); font-size: 14px; padding: 4px 0; }
  .summary-label { color: var(--muted); font-size: 13px; }
  .summary-label .inc { color: #475569; }
  .summary-price { font-size: 22px; font-weight: 800; color: var(--accent); }

  @media (max-width: 760px) {
    .points { grid-template-columns: 1fr 1fr; }
    .summary-groups { grid-template-columns: 1fr 1fr; }
    .columns { grid-template-columns: 1fr; }
    .summary-box { padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
    .group-right { flex-direction: column; align-items: flex-end; gap: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Таиланд 2027</h1>
  <p class="sub" id="subtitle"></p>

  <section class="group-card" id="builder"></section>

  <div class="section-title" id="cart-title">Корзина</div>
  <div id="cart"></div>
</div>

<div class="summary-box" id="summary">
  <div class="summary-inner">
    <div class="summary-groups" id="summary-groups"></div>
    <div class="summary-total">
      <div class="summary-label" id="total-label">Корзина пуста</div>
      <div class="summary-price" id="grand-total">—</div>
    </div>
  </div>
</div>

<script>
(async function () {
  const data = await (await fetch('../data/th27.json')).json();
  const { meta, outbound, back } = data;
  const groups = meta.groups, cities = meta.allCities, feeders = meta.feeders, krabi = meta.krabi || {};
  const STORE = 'th27.cart.v1';
  const DRAFT = 'th27.draft.v1';

  const fmt = n => n.toLocaleString('ru-RU') + '\u00a0₽';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const shortDate = d => d.split('.').slice(0, 2).join('.');
  const people = n => {
    const m10 = n % 10, m100 = n % 100;
    return n + (m10 === 1 && m100 !== 11 ? ' человек' : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) ? ' человека' : ' человек');
  };
  const stopsText = n => n === 0 ? 'прямой' : n + (n === 1 ? ' пересадка' : n < 5 ? ' пересадки' : ' пересадок');
  const groupOf = id => groups.find(g => g.id === id) || null;

  // ---------- детали рейсов (flights / layovers в сегменте) ----------
  const durText = m => {
    const h = Math.floor(m / 60), mm = m % 60;
    return h ? h + '\u00a0ч' + (mm ? '\u00a0' + mm + '\u00a0мин' : '') : mm + '\u00a0мин';
  };
  const hhmm = s => s.slice(11, 16);
  const dayShift = (a, b) => {
    const d = Math.round((Date.parse(b.slice(0, 10)) - Date.parse(a.slice(0, 10))) / 864e5);
    return d > 0 ? '<sup>+' + d + '</sup>' : '';
  };
  // ссылка на схему салона seatmaps.com хранится в самом рейсе (flight.seatmap)
  const aircraftHTML = f => f.seatmap
    ? `<a href="${esc(f.seatmap)}" target="_blank" rel="noopener">${esc(f.aircraft)}</a>` : esc(f.aircraft);
  // один рейс: «KBV 22:00 → BKK 23:30 · Airbus A319»
  const flightLine = f => `${esc(f.from)} ${hhmm(f.dep)} → ${esc(f.to)} ${hhmm(f.arr)}${dayShift(f.dep, f.arr)}` +
    (f.aircraft ? ` <span class="fl-dim">· ${aircraftHTML(f)}</span>` : '');
  function layoverLine(y) {
    const tags = [];
    if (y.selfTransfer) tags.push('самостоятельная пересадка');
    if (y.night) tags.push('ночью');
    if (y.changeAirport) tags.push('смена аэропорта');
    const cls = y.selfTransfer ? ' danger' : (y.night || y.changeAirport ? ' warn' : '');
    return `<div class="fl-lay${cls}">↳ ${durText(y.minutes)} · ${esc(y.city)} (${esc(y.airport)})${tags.length ? ' · ' + tags.join(' · ') : ''}</div>`;
  }
  function flightDetails(seg) {
    if (!seg.flights || !seg.flights.length) return '';
    const lays = seg.layovers || [];
    const rows = seg.flights.map((f, i) =>
      `<div class="fl-leg">${flightLine(f)}</div>${lays[i] ? layoverLine(lays[i]) : ''}`);
    return `<div class="fl">${rows.join('')}</div>`;
  }
  // «Справочно: 23.03 KBV 22:00 → BKK 23:30 · Airbus A319» — без дублирования времени
  function refLine(r) {
    if (!r || !r.date) return '';
    const body = r.flights && r.flights.length
      ? r.flights.map(flightLine).join('; ')
      : `${r.dep} → ${r.arr}`;
    return `<div class="meta">Справочно: ${shortDate(r.date)} ${body}</div>`;
  }

  // ---------- данные ----------
  const segOf = (v, hub) => v ? v.segments[hub] || null : null;
  const availOut = hub => outbound.filter(v => v.segments[hub]);
  // чартер обратно доступен только в паре с чартером туда: из общего списка он скрыт
  const availBack = (hub, outV) => back.filter(v => v.segments[hub] &&
    (v.charter ? !!(outV && outV.charter && outV.pairWith === v.id) : !(outV && outV.charter)));
  // название варианта для хаба: у сегмента может быть своё (Пхукет Turkish / Etihad / прямой Aeroflot)
  const titleFor = (v, hub) => ((v.segments && v.segments[hub]) || {}).title || v.title;
  const titleOf = (id, hub) => { const v = outbound.find(x => x.id === id); return v ? titleFor(v, hub) : id; };

  // перелёт из Краби в аэропорт вылета (Бангкок / Куала-Лумпур; Пхукет — условно бесплатно)
  const krabiLeg = seg => {
    if (!seg) return null;
    const k = krabi[seg.orig];
    return k ? Object.assign({ hub: seg.orig }, k) : { hub: seg.orig, unknown: true };
  };

  // единым билетом: рейс «туда» из пары bundleWith и тот же хаб туда и обратно
  const isBundled = (backV, outV, st) =>
    !!(backV && outV && st.outHub === st.backHub && (backV.bundleWith || []).includes(outV.id));
  const backEff = (seg, bundled) => bundled && seg.bundle ? seg.bundle : seg;   // {price, links}
  const outPrice = (v, hub) => v.segments[hub].price;
  const backPriceFor = (v, hub, outV, st) => {
    const seg = v.segments[hub], k = krabiLeg(seg);
    return backEff(seg, isBundled(v, outV, st)).price + (k && !k.unknown ? k.price : 0);
  };
  const cheapestBy = (list, f) => list.length ? list.reduce((a, b) => f(b) < f(a) ? b : a) : null;

  // дорога между городами: free | priced | unknown
  const pairKey = (a, b) => [a, b].sort().join('|');
  function leg(a, b, st, slot) {
    if (a === b) return { type: 'free', price: 0 };
    const f = feeders.find(f => (f.a === a && f.b === b) || (f.a === b && f.b === a));
    if (!f || !f.options || !f.options.length) return { type: 'unknown', a, b };
    const key = slot + ':' + pairKey(a, b);
    let o = f.options.find(x => x.id === (st.legOpt[key] || ''));
    if (!o) o = cheapestBy(f.options, x => x.price);
    return { type: 'priced', a, b, key, options: f.options, option: o, price: o.price,
             ref: (o.legs || {})[a + '→' + b] || null };
  }

  // ---------- состояние ----------
  // st: { gid|null, size, start, outHub, backHub, end, auto, outId, backId, legOpt, charterOn, prevBackHub }
  function newDraft(gid) {
    const g = groupOf(gid);
    const start = g ? g.startCity : cities[0];
    const st = {
      gid: g ? g.id : null, size: g ? g.size : 1,
      start, outHub: start, backHub: start, end: start,
      auto: { outHub: true, backHub: true, end: true },
      outId: null, backId: null, legOpt: {}, charterOn: false, prevBackHub: null,
    };
    ensure(st);
    return st;
  }

  function ensure(st) {
    const o = availOut(st.outHub);
    const pref = (meta.defaultVariants || {});
    if (!o.find(v => v.id === st.outId)) {
      const pid = (pref[st.outHub] || {}).out;
      const free = o.filter(v => !v.charter);   // чартер сам не выбирается
      st.outId = o.find(v => v.id === pid && !v.charter) ? pid
        : (cheapestBy(free, v => outPrice(v, st.outHub)) || {}).id || null;
    }
    const outV = outbound.find(v => v.id === st.outId) || null;

    // чартер: только парой туда-обратно, хаб возвращения = хаб вылета
    if (outV && outV.charter) {
      if (!st.charterOn) { st.charterOn = true; st.prevBackHub = st.backHub; }
      st.backHub = st.outHub;
      st.backId = outV.pairWith;
      return;
    }
    if (st.charterOn) {   // вышли из чартера: возвращаем прежний хаб, рейс обратно выберется заново
      st.charterOn = false;
      st.backHub = st.auto.backHub ? st.outHub : st.prevBackHub;
      st.backId = null;
    }

    const b = availBack(st.backHub, outV);
    if (!b.find(v => v.id === st.backId)) {
      const pid = (pref[st.backHub] || {}).back;
      if (b.find(v => v.id === pid)) {
        st.backId = pid;
      } else {
        st.backId = (cheapestBy(b, v => backPriceFor(v, st.backHub, outV, st)) || {}).id || null;
      }
    }
  }

  // ---------- расчёт ----------
  function calc(st) {
    const outV = outbound.find(v => v.id === st.outId) || null;
    const backV = back.find(v => v.id === st.backId) || null;
    const outSeg = segOf(outV, st.outHub), backSeg = segOf(backV, st.backHub);
    const leg1 = leg(st.start, st.outHub, st, 'leg1'), leg2 = leg(st.backHub, st.end, st, 'leg2');
    const kr = krabiLeg(backSeg);
    const bundled = !!(backSeg && isBundled(backV, outV, st));
    const backUse = backSeg ? backEff(backSeg, bundled) : null;
    const issues = [];
    if (!outSeg) issues.push('нет рейсов туда из города «' + st.outHub + '»');
    if (!backSeg) issues.push('нет рейсов обратно в город «' + st.backHub + '»');
    [leg1, leg2].forEach(l => { if (l.type === 'unknown') issues.push('нет данных о проезде ' + l.a + ' — ' + l.b); });
    if (kr && kr.unknown) issues.push('нет данных о перелёте Краби — ' + kr.hub);
    const perPerson = issues.length ? null : leg1.price + outSeg.price + backUse.price + kr.price + leg2.price;
    // без пары — только цена на 1 человека
    const total = perPerson == null ? null : (st.gid ? perPerson * st.size : perPerson);
    return { st, outV, backV, outSeg, backSeg, backUse, bundled, leg1, leg2, kr, issues, perPerson, total };
  }

  // ---------- корзина ----------
  let cart = [];            // [{ uid, open, st }]
  let uidSeq = 0;
  let draft = newDraft(null);

  const pickFields = st => ({ gid: st.gid, start: st.start, outHub: st.outHub, backHub: st.backHub,
    end: st.end, outId: st.outId, backId: st.backId, legOpt: st.legOpt });

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify({ items: cart.map(e => pickFields(e.st)) })); } catch (e) { /* без хранилища */ }
  }

  function load() {
    let raw;
    try { raw = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { raw = null; }
    if (!raw || !Array.isArray(raw.items)) return;
    const used = new Set();
    raw.items.forEach(it => {
      if (!it || typeof it !== 'object') return;
      const g = it.gid ? groupOf(it.gid) : null;
      if (!g || used.has(g.id)) return;               // в корзине только маршруты с парой
      if (!cities.includes(it.start) || !cities.includes(it.outHub) || !cities.includes(it.backHub) || !cities.includes(it.end)) return;
      const st = { gid: g ? g.id : null, size: g ? g.size : 1, start: it.start, outHub: it.outHub, backHub: it.backHub,
        end: it.end, auto: { outHub: false, backHub: false, end: false }, outId: it.outId, backId: it.backId,
        legOpt: (it.legOpt && typeof it.legOpt === 'object') ? it.legOpt : {}, charterOn: false, prevBackHub: null };
      const c = calc(st);
      if (!c.outV || !c.backV || !c.outSeg || !c.backSeg || c.total == null) return;
      if ((c.outV.charter || c.backV.charter) && !(c.outV.charter && c.backV.charter && c.outV.pairWith === c.backV.id)) return;
      if (g) used.add(g.id);
      cart.push({ uid: ++uidSeq, open: false, st });
    });
  }

  // черновик конструктора переживает перезагрузку
  function saveDraft() {
    try {
      const d = draft;
      localStorage.setItem(DRAFT, JSON.stringify({ gid: d.gid, start: d.start, outHub: d.outHub, backHub: d.backHub,
        end: d.end, auto: d.auto, outId: d.outId, backId: d.backId, legOpt: d.legOpt,
        charterOn: d.charterOn, prevBackHub: d.prevBackHub }));
    } catch (e) { /* без хранилища */ }
  }

  function loadDraft() {
    let r;
    try { r = JSON.parse(localStorage.getItem(DRAFT) || 'null'); } catch (e) { r = null; }
    if (!r || typeof r !== 'object') return;
    if (![r.start, r.outHub, r.backHub, r.end].every(c => cities.includes(c))) return;
    const used = new Set(cart.map(e => e.st.gid));
    const g = r.gid && !used.has(r.gid) ? groupOf(r.gid) : null;   // пара уже в корзине или исчезла -> без пары
    const a = (r.auto && typeof r.auto === 'object') ? r.auto : {};
    draft = {
      gid: g ? g.id : null, size: g ? g.size : 1,
      start: r.start, outHub: r.outHub, backHub: r.backHub, end: r.end,
      auto: { outHub: !!a.outHub, backHub: !!a.backHub, end: !!a.end },
      outId: typeof r.outId === 'string' ? r.outId : null, backId: typeof r.backId === 'string' ? r.backId : null,
      legOpt: (r.legOpt && typeof r.legOpt === 'object' && !Array.isArray(r.legOpt)) ? r.legOpt : {},
      charterOn: !!r.charterOn, prevBackHub: cities.includes(r.prevBackHub) ? r.prevBackHub : r.outHub,
    };
    ensure(draft);   // недоступные рейсы заменятся доступными
  }

  // ---------- отрисовка ----------
  function selectPair(st) {
    const used = new Set(cart.map(e => e.st.gid).filter(Boolean));
    const opts = ['<option value="">Без пары</option>'].concat(groups
      .filter(g => !used.has(g.id))
      .map(g => `<option value="${g.id}"${g.id === st.gid ? ' selected' : ''}>${esc(g.name)} (${people(g.size)})</option>`));
    return `<div class="field"><label>Пара</label><select data-f="gid">${opts.join('')}</select></div>`;
  }

  function selectCity(field, value, label, noFlightsFor, disabled) {
    const opts = cities.map(c => {
      const empty = noFlightsFor && !noFlightsFor(c);
      return `<option value="${esc(c)}"${c === value ? ' selected' : ''}>${esc(c)}${empty ? ' — нет рейсов' : ''}</option>`;
    }).join('');
    return `<div class="field"><label>${label}</label><select data-f="${field}"${disabled ? ' disabled' : ''}>${opts}</select></div>`;
  }

  function selectVariant(field, list, selId, label, disabled, hub) {
    if (!list.length) {
      return `<div class="field"><label>${label}</label><select disabled><option>Нет рейсов</option></select></div>`;
    }
    const opts = list.map(v =>
      `<option value="${v.id}"${v.id === selId ? ' selected' : ''}>${esc(titleFor(v, hub))}</option>`).join('');
    return `<div class="field"><label>${label}</label><select data-f="${field}"${disabled ? ' disabled' : ''}>${opts}</select></div>`;
  }

  function legPlaque(l, field, ro) {
    if (l.type === 'free') return '';
    if (l.type === 'unknown') {
      return `<div class="plaque warn"><div class="route">${esc(l.a)} → ${esc(l.b)}</div>
        <div class="note">Нет данных о проезде</div></div>`;
    }
    const o = l.option;
    const picker = !ro && l.options.length > 1
      ? `<div class="field" style="margin:6px 0"><select data-f="${field}" data-key="${esc(l.key)}">${
          l.options.map(x => `<option value="${x.id}"${x.id === o.id ? ' selected' : ''}>${esc(x.mode)} · ${esc(x.carrier)} — ${fmt(x.price)}</option>`).join('')
        }</select></div>` : '';
    const ref = refLine(l.ref);
    const est = o.estimate ? `<div class="chip">ориентировочно, по аналогии с рейсами в Пермь</div>` : '';
    const link = o.link ? `<a href="${esc(o.link)}" target="_blank" rel="noopener">Билет</a>` : '';
    return `<div class="plaque leg"><div class="route">${esc(l.a)} → ${esc(l.b)} · ${esc(o.mode)}, ${esc(o.carrier)}</div>
      ${picker}${ref}${est}
      <div class="price-line"><span>${link}</span><span class="price">${fmt(l.price)} <small>на 1 чел.</small></span></div></div>`;
  }

  function krabiPlaque(k) {
    if (!k) return '';
    if (k.unknown) {
      return `<div class="plaque warn"><div class="route">Краби → ${esc(k.hub)}</div><div class="note">Нет данных о перелёте</div></div>`;
    }
    if (k.free) {
      return `<div class="plaque leg"><div class="route">Краби → ${esc(k.hub)} · условно бесплатно</div></div>`;
    }
    const ref = refLine(k);
    const link = k.link ? `<a href="${esc(k.link)}" target="_blank" rel="noopener">Билет</a>` : '';
    return `<div class="plaque leg"><div class="route">Краби → ${esc(k.hub)} · Самолёт, ${esc(k.carrier)}</div>${ref}
      <div class="price-line"><span>${link}</span><span class="price">${fmt(k.price)} <small>на 1 чел.</small></span></div></div>`;
  }

  function flightPlaque(kind, seg, variant, hub, bundled) {
    if (!seg) return `<div class="plaque empty">Нет рейсов ${kind === 'out' ? 'из' : 'в'} города «${esc(hub)}»</div>`;
    const route = kind === 'out' ? `${esc(hub)} → ${esc(seg.dest)}` : `${esc(seg.orig)} → ${esc(hub)}`;
    const use = kind === 'back' ? backEff(seg, bundled) : seg;
    const links = (use.links || []).map((l, i) =>
      `<a href="${esc(l)}" target="_blank" rel="noopener">Билет${use.links.length > 1 ? ' ' + (i + 1) : ''}</a>`).join('');
    let chip = '';
    if (kind === 'back' && seg.bundle) {
      const pairs = (variant.bundleWith || []).map(id => '«' + titleOf(id, hub) + '»').join(', ');
      chip = bundled
        ? `<div class="chip ok">единым билетом с рейсом туда</div>`
        : `<div class="chip">отдельным билетом · единым билетом ${fmt(seg.bundle.price)}, если туда ${esc(pairs)} и тот же хаб</div>`;
    }
    return `<div class="plaque">
      <div class="when">${shortDate(seg.date)} ${seg.time} → ${shortDate(seg.arrDate)} ${seg.arrTime}</div>
      <div class="route">${route}</div>
      <div class="meta">${esc(seg.airline)} · ${stopsText(seg.stops)} ·
        <span class="${seg.easy ? 'ok' : 'bad'}">${seg.easy ? 'лёгкая пересадка' : 'сложная пересадка'}</span></div>
      ${seg.note ? `<div class="note">${esc(seg.note)}</div>` : ''}
      ${seg.nights ? `<div class="note">Ночей в пути: ${seg.nights}</div>` : ''}
      ${flightDetails(seg)}
      ${chip}
      <div class="price-line"><span>${links}</span><span class="price">${fmt(use.price)} <small>на 1 чел.</small></span></div>
    </div>`;
  }

  function breakdown(c) {
    const st = c.st, pp = c.perPerson == null ? 'уточняется' : fmt(c.perPerson);
    const rows = st.gid
      ? `<div class="row"><span>На 1 человека</span><span>${pp}</span></div>
         <div class="row total"><span>Итого × ${st.size}</span><span>${c.total == null ? 'уточняется' : fmt(c.total)}</span></div>`
      : `<div class="row total"><span>На 1 человека</span><span>${pp}</span></div>`;
    return `<div class="breakdown">${rows}
      ${c.issues.length ? `<div class="issues">${c.issues.map(i => '• ' + esc(i)).join('<br>')}</div>` : ''}
    </div>`;
  }

  // конструктор
  function builderHTML() {
    const st = draft, c = calc(st), locked = !!(c.outV && c.outV.charter);
    return `
      <div class="builder-title">Конструктор маршрута</div>
      <div class="points">
        ${selectPair(st)}
        ${selectCity('start', st.start, 'Старт')}
        ${selectCity('outHub', st.outHub, 'Хаб вылета в Таиланд', h => availOut(h).length > 0)}
        ${selectCity('backHub', st.backHub, locked ? 'Хаб возвращения (чартер)' : 'Хаб возвращения', h => availBack(h, c.outV).length > 0, locked)}
        ${selectCity('end', st.end, 'Конец маршрута')}
      </div>
      <div class="columns">
        <div class="col">
          <div class="col-title">Туда</div>
          ${selectVariant('outId', availOut(st.outHub), st.outId, 'Перелёт в Таиланд', false, st.outHub)}
          ${legPlaque(c.leg1, 'leg1', false)}
          ${flightPlaque('out', c.outSeg, c.outV, st.outHub, false)}
        </div>
        <div class="col">
          <div class="col-title">Обратно</div>
          ${selectVariant('backId', availBack(st.backHub, c.outV), st.backId, 'Перелёт из Таиланда', locked, st.backHub)}
          ${locked ? '<div class="chip">чартер: только туда-обратно одним билетом</div>' : ''}
          ${krabiPlaque(c.kr)}
          ${flightPlaque('back', c.backSeg, c.backV, st.backHub, c.bundled)}
          ${legPlaque(c.leg2, 'leg2', false)}
        </div>
      </div>
      ${breakdown(c)}
      <div class="add-row"><button type="button" class="btn${st.gid ? '' : ' need-pair'}" id="add"${(c.total == null || !st.gid) ? ' disabled' : ''}>${st.gid ? 'Добавить' : 'Выберите пару'}</button></div>`;
  }

  function allPairsAdded() {
    return groups.every(g => cart.some(e => e.st.gid === g.id));
  }

  function renderBuilder() {
    const box = document.getElementById('builder');
    if (allPairsAdded()) {
      box.innerHTML = '<div class="all-added">Все пары добавлены. Удалите маршрут из корзины, чтобы собрать заново.</div>';
      return;
    }
    box.innerHTML = builderHTML();
  }

  // краткий маршрут: Пермь → Бангкок → Пермь
  function routeText(c) {
    const st = c.st;
    const parts = [st.start, st.outHub, c.outSeg && c.outSeg.dest, c.backSeg && c.backSeg.orig, st.backHub, st.end].filter(Boolean);
    return parts.filter((p, i) => i === 0 || p !== parts[i - 1]).join(' → ');
  }

  const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';

  function cartCardHTML(e) {
    const c = calc(e.st), st = e.st, g = groupOf(st.gid);
    const name = g ? g.name : 'Без пары · ' + st.start;
    return `
      <div class="cart-head">
        <button type="button" class="group-header" data-toggle="${e.uid}" aria-expanded="${e.open}">
          <span class="group-title"><span class="chev"></span>
            <span class="t">${esc(name)}<div class="group-route">${esc(routeText(c))}</div></span></span>
          <span class="group-right">
            <span class="group-size">${g ? people(g.size) : ''}</span>
            <span class="group-sum">${fmt(c.total)}${g ? '' : ' <small>на 1 чел.</small>'}</span>
          </span>
        </button>
        <button type="button" class="trash" data-del="${e.uid}" aria-label="Удалить маршрут: ${esc(name)}" title="Удалить">${TRASH}</button>
      </div>
      <div class="group-body">
        <div class="columns">
          <div class="col">
            <div class="col-title">Туда</div>
            ${legPlaque(c.leg1, 'leg1', true)}
            ${flightPlaque('out', c.outSeg, c.outV, st.outHub, false)}
          </div>
          <div class="col">
            <div class="col-title">Обратно</div>
            ${krabiPlaque(c.kr)}
            ${flightPlaque('back', c.backSeg, c.backV, st.backHub, c.bundled)}
            ${legPlaque(c.leg2, 'leg2', true)}
          </div>
        </div>
        ${breakdown(c)}
      </div>`;
  }

  function renderCart() {
    const box = document.getElementById('cart');
    document.getElementById('cart-title').textContent = cart.length ? 'Корзина · ' + cart.length : 'Корзина';
    if (!cart.length) {
      box.innerHTML = '<div class="cart-empty">Корзина пуста. Соберите маршрут выше и нажмите «Добавить».</div>';
      return;
    }
    box.innerHTML = cart.map(e =>
      `<section class="group-card${e.open ? '' : ' collapsed'}" data-uid="${e.uid}">${cartCardHTML(e)}</section>`).join('');
  }

  function renderSummary() {
    let sum = 0;
    document.getElementById('summary-groups').innerHTML = groups.map(g => {
      const e = cart.find(x => x.st.gid === g.id);
      const t = e ? calc(e.st).total : null;
      if (t != null) sum += t;
      return `<div class="summary-group${e ? '' : ' none'}"><div class="n">${esc(g.name)}</div>
        <div class="p">${fmt(t || 0)}</div></div>`;
    }).join('');
    const label = document.getElementById('total-label');
    label.textContent = cart.length ? `Итого по корзине (${cart.length})` : 'Корзина пуста';
    document.getElementById('grand-total').textContent = cart.length ? fmt(sum) : '—';
    document.body.style.paddingBottom = (document.getElementById('summary').offsetHeight + 16) + 'px';
  }

  function renderAll() { renderBuilder(); renderCart(); renderSummary(); }

  // ---------- события ----------
  document.getElementById('builder').addEventListener('change', e => {
    const el = e.target, f = el.dataset.f;
    if (!f) return;
    const st = draft, v = el.value;
    if (f === 'gid') {
      draft = newDraft(v || null);        // выбор пары сбрасывает форму под старт пары
      if (!v) { draft.start = st.start; draft.outHub = draft.backHub = draft.end = st.start; draft.outId = draft.backId = null; ensure(draft); }
    } else if (f === 'start') {
      st.start = v;
      if (st.auto.outHub) st.outHub = v;
      if (st.auto.backHub) st.backHub = st.outHub;
      if (st.auto.end) st.end = v;
    } else if (f === 'outHub') {
      st.outHub = v; st.auto.outHub = false;
      if (st.auto.backHub) st.backHub = v;
    } else if (f === 'backHub') {
      if (st.charterOn) return;
      st.backHub = v; st.auto.backHub = false;
    } else if (f === 'end') {
      st.end = v; st.auto.end = false;
    } else if (f === 'outId' || f === 'backId') {
      st[f] = v;
    } else if (f === 'leg1' || f === 'leg2') {
      st.legOpt[el.dataset.key] = v;
    }
    ensure(draft);
    saveDraft();
    renderBuilder();
    const again = document.querySelector(`#builder [data-f="${f}"]`);
    if (again) again.focus();
  });

  document.getElementById('builder').addEventListener('click', e => {
    if (!e.target.closest('#add')) return;
    const c = calc(draft);
    if (c.total == null || !draft.gid) return;      // без пары добавлять нельзя
    if (cart.some(x => x.st.gid === draft.gid)) return;
    cart.push({ uid: ++uidSeq, open: false, st: JSON.parse(JSON.stringify(draft)) });
    save();
    draft = newDraft(null);
    saveDraft();
    renderAll();
    const sel = document.querySelector('#builder [data-f="gid"]') || document.querySelector('#cart [data-toggle]');
    if (sel) sel.focus();
  });

  document.getElementById('cart').addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if (del) {
      const uid = +del.dataset.del;
      const idx = cart.findIndex(x => x.uid === uid);
      if (idx < 0) return;
      cart.splice(idx, 1);
      save();
      // пара снова доступна в конструкторе; черновик не сбрасываем
      renderAll();
      const next = document.querySelector('#cart .trash') || document.getElementById('add');
      if (next) next.focus();
      return;
    }
    const btn = e.target.closest('[data-toggle]');
    if (!btn) return;
    const uid = +btn.dataset.toggle;
    const item = cart.find(x => x.uid === uid);
    if (!item) return;
    item.open = !item.open;
    renderCart();
    const again = document.querySelector(`[data-toggle="${uid}"]`);
    if (again) again.focus();
  });

  // ---------- старт ----------
  document.title = meta.title + ' · ' + meta.dates;
  document.getElementById('title').textContent = meta.title;
  const total = groups.reduce((s, g) => s + g.size, 0);
  document.getElementById('subtitle').textContent = meta.dates + ' · ' + people(total);
  load();
  loadDraft();
  renderAll();
})().catch(err => {
  console.error(err);
  document.body.innerHTML = '<div style="padding:40px;color:#dc2626">Не удалось загрузить данные: ' + err.message + '</div>';
});
</script>
</body>
</html>
