<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои путешествия</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e2e5ea;
    --accent: #2563eb;
    --text: #1f2430;
    --muted: #8a91a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    padding: 40px 20px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  .description { color: var(--muted); font-size: 15px; margin: 0 0 40px; }
  .routes { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .route-card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s, box-shadow .15s, transform .15s;
    cursor: pointer;
  }
  .route-card:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
    transform: translateY(-2px);
  }
  .route-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .flag { font-size: 32px; }
  .year { color: var(--muted); font-size: 14px; font-weight: 500; background: var(--bg); padding: 4px 8px; border-radius: 4px; }
  .route-card h3 { margin: 0 0 8px; font-size: 20px; color: var(--text); }
  .dates { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .price { font-size: 18px; font-weight: 600; color: var(--accent); margin: 12px 0; }
  .status { color: var(--muted); font-size: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .loading { text-align: center; color: var(--muted); padding: 40px 20px; }
  .error { color: #dc2626; padding: 16px; background: #fee2e2; border-radius: 8px; margin: 20px 0; }

  @media (max-width: 640px) {
    body { padding: 24px 16px; }
    h1 { font-size: 24px; }
    .routes { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Мои путешествия</h1>
  <p class="description">Сравнение вариантов билетов по маршрутам</p>
  <div class="routes" id="routes">
    <div class="loading">Загрузка маршрутов...</div>
  </div>
</div>

<script>
  // Список маршрутов
  const routes = [
    { id: 'es26', name: 'Испания', flag: '🇪🇸' }
  ];

  Promise.all(routes.map(route => 
    fetch(`data/${route.id}.json`)
      .then(r => r.json())
      .then(data => ({
        ...route,
        meta: data.meta,
        outbound: data.outbound,
        back: data.back
      }))
      .catch(err => {
        console.error(`Ошибка загрузки ${route.id}:`, err);
        return { ...route, error: true };
      })
  )).then(loadedRoutes => {
    const container = document.getElementById('routes');
    container.innerHTML = '';

    if (loadedRoutes.length === 0) {
      container.innerHTML = '<div class="error">Нет доступных маршрутов</div>';
      return;
    }

    loadedRoutes.forEach(route => {
      if (route.error) {
        container.innerHTML += `<div class="error">Ошибка загрузки маршрута ${route.name}</div>`;
        return;
      }

      const minOut = Math.min(...route.outbound.map(o => o.price));
      const minBack = Math.min(...route.back.map(o => o.price));
      const minPrice = minOut + minBack;
      const fmt = n => n.toLocaleString("ru-RU") + " ₽";
      const year = route.meta.dates.split('–')[0].trim().split('.')[2];
      
      const card = document.createElement('a');
      card.href = `${route.id}/`;
      card.className = 'route-card';
      card.innerHTML = `
        <div class="route-header">
          <span class="flag">${route.flag}</span>
          <span class="year">${year}</span>
        </div>
        <h3>${route.name}</h3>
        <p class="dates">${route.meta.dates}</p>
        <div class="price">От ${fmt(minPrice)}</div>
        <p class="status">Завершено</p>
      `;
      container.appendChild(card);
    });
  });
</script>
</body>
</html>
